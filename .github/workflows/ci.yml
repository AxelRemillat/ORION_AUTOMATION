# Vérification de chaque PR vers main : garde-fou des migrations, types,
# lint, tests et build. Aucune clé réelle : le build tourne avec des
# placeholders NEXT_PUBLIC_*, les tests avec des mocks et des fixtures.
name: CI

on:
  pull_request:
    branches: [main]
    # `ready_for_review` : une PR passée de brouillon à prête relance la CI, donc
    # l'auto-merge (déclenché par la fin de CI). Sans lui, une CI finie pendant
    # le brouillon ne se relançait jamais et la PR restait ouverte (#38, #40, #41).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Vérifier la PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Un script appelé dans une chaîne mais absent (« Missing script:
      # test:contact », #39) ne se voyait qu'au milieu de `npm test`.
      - name: Scripts npm appelés et définis
        run: |
          node -e '
            const s = require("./package.json").scripts;
            const missing = Object.entries(s).flatMap(([name, cmd]) =>
              [...cmd.matchAll(/npm run ([\w:.-]+)/g)].map((m) => m[1]).filter((c) => !(c in s)).map((c) => `${name} → ${c}`));
            if (missing.length) { console.error("Scripts appelés mais absents :", missing.join(", ")); process.exit(1); }
            console.log("Chaîne test :", s.test.split("&&").length, "suites, toutes définies.");
          '

      - name: Garde-fou des migrations
        run: npm run check:migrations

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Toutes les suites, sans réseau ni clé (mocks et fixtures). test:recherche
      # compris : il ne fait aucun appel réseau, il reste donc bloquant.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
